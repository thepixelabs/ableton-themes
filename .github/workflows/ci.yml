name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-drift:
    name: verify + drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up bun
        # Pinned to the version the maintainer tests against, not "latest".
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Verify
        # 21 of the 24 checks run here. Three need a local Ableton install and
        # skip cleanly on a runner without one.
        run: bun tools/verify.js

      - name: Rebuild editor.html and check it matches src/
        run: |
          python3 tools/build.py
          if ! git diff --quiet -- editor.html; then
            echo "::error::editor.html is stale. src/ or build/schema.js changed since it was last built."
            echo "Fix: run 'python3 tools/build.py', review the diff, and commit editor.html."
            git --no-pager diff --stat -- editor.html
            exit 1
          fi
          echo "editor.html matches src/."

      - name: Regenerate the pack and check it matches tools/gen_pack.js
        run: |
          # Delete the artifacts first. A plain regenerate-and-diff cannot tell
          # "regenerated identically" from "the generator stopped writing this
          # file at all", because both leave the checkout untouched. Removing
          # them first means the generator has to actually produce them.
          rm -f pack/*/*.ask pack/pixelabs-theme-pack.zip install-macos.command install-windows.bat

          bun tools/gen_pack.js

          missing=0
          for f in pack/pixelabs-theme-pack.zip install-macos.command install-windows.bat; do
            [ -f "$f" ] || { echo "::error::$f was not regenerated"; missing=1; }
          done
          count=$(find pack -name '*.ask' | wc -l | tr -d ' ')
          [ "$count" -eq 45 ] || { echo "::error::expected 45 .ask files, got $count"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

          changed="$(git status --porcelain -- pack/ install-macos.command install-windows.bat)"
          if [ -n "$changed" ]; then
            echo "::error::pack/, the zip, or the installer scripts are stale relative to tools/gen_pack.js."
            echo "Fix: run 'bun tools/gen_pack.js', review the diff including any added or removed .ask files, and commit it."
            echo "$changed"
            exit 1
          fi
          echo "pack/ matches tools/gen_pack.js ($count themes, zip and both installers regenerated byte for byte)."
