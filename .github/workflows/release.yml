name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish or republish, for example v2026.09.02"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Never cancel a publish mid upload.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: attach the pack to the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Verify before publishing
        # A tag can point at a commit that never went through CI, so re-check
        # rather than assume.
        run: bun tools/verify.js

      - name: Confirm this tag's pack matches its own generator
        run: |
          rm -f pack/*/*.ask pack/pixelabs-theme-pack.zip install-macos.command install-windows.bat
          bun tools/gen_pack.js
          changed="$(git status --porcelain -- pack/ install-macos.command install-windows.bat)"
          if [ -n "$changed" ]; then
            echo "::error::This tag's pack does not match tools/gen_pack.js. Refusing to publish it."
            echo "$changed"
            exit 1
          fi

      - name: Create the release and attach the pack
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: pack/pixelabs-theme-pack.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
